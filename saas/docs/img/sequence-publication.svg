<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0a0a0a"/></marker></defs><rect width="800" height="550" fill="#fff"/><rect x="23.0" y="12" width="144" height="34" rx="6" fill="#f4f4f4" stroke="#0a0a0a" stroke-width="1.4"/><text x="95.0" y="33.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0a0a0a">Cron</text><line x1="95.0" y1="46" x2="95.0" y2="536" stroke="#0a0a0a" stroke-width="1.3" stroke-dasharray="6 5"/><rect x="226.33333333333337" y="12" width="144" height="34" rx="6" fill="#f4f4f4" stroke="#0a0a0a" stroke-width="1.4"/><text x="298.33333333333337" y="33.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0a0a0a">scheduler.js</text><line x1="298.33333333333337" y1="46" x2="298.33333333333337" y2="536" stroke="#0a0a0a" stroke-width="1.3" stroke-dasharray="6 5"/><rect x="429.6666666666667" y="12" width="144" height="34" rx="6" fill="#f4f4f4" stroke="#0a0a0a" stroke-width="1.4"/><text x="501.6666666666667" y="33.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0a0a0a">D1</text><line x1="501.6666666666667" y1="46" x2="501.6666666666667" y2="536" stroke="#0a0a0a" stroke-width="1.3" stroke-dasharray="6 5"/><rect x="633.0" y="12" width="144" height="34" rx="6" fill="#f4f4f4" stroke="#0a0a0a" stroke-width="1.4"/><text x="705.0" y="33.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0a0a0a">LinkedIn</text><line x1="705.0" y1="46" x2="705.0" y2="536" stroke="#0a0a0a" stroke-width="1.3" stroke-dasharray="6 5"/><line x1="95.0" y1="86" x2="298.33333333333337" y2="86" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#p)"/><text x="196.66666666666669" y="79.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">1. chaque minute</text><line x1="298.33333333333337" y1="132" x2="501.6666666666667" y2="132" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#p)"/><text x="400.0" y="125.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">2. périme les posts en retard de plus de 3 h</text><line x1="298.33333333333337" y1="178" x2="501.6666666666667" y2="178" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#p)"/><text x="400.0" y="171.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">3. liste les posts dus</text><rect x="306.33333333333337" y="202" width="330" height="26" rx="3" fill="#fff" stroke="#0a0a0a" stroke-width="1.4"/><text x="471.33333333333337" y="219" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a">verrou POSTAGENT_LIVE fermé : arrêt, rien n'est réservé</text><line x1="298.33333333333337" y1="270" x2="501.6666666666667" y2="270" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#p)"/><text x="400.0" y="263.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">5. réserve : UPDATE … WHERE status = 'scheduled'</text><line x1="298.33333333333337" y1="316" x2="501.6666666666667" y2="316" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#p)"/><text x="400.0" y="309.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">6. lit le post, déchiffre le jeton</text><line x1="298.33333333333337" y1="362" x2="705.0" y2="362" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#p)"/><text x="501.6666666666667" y="355.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">7. envoie le média (initializeUpload, PUT)</text><line x1="298.33333333333337" y1="408" x2="705.0" y2="408" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#p)"/><text x="501.6666666666667" y="401.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">8. POST /rest/posts</text><line x1="705.0" y1="454" x2="298.33333333333337" y2="454" stroke="#0a0a0a" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#p)"/><text x="501.6666666666667" y="447.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">9. 201 + x-restli-id</text><line x1="298.33333333333337" y1="500" x2="501.6666666666667" y2="500" stroke="#0a0a0a" stroke-width="1.3" marker-end="url(#p)"/><text x="400.0" y="493.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#0a0a0a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">10. published + post_id, ou failed + erreur</text></svg>
