name = "post-agent-clock"
main = "src/index.js"
compatibility_date = "2026-09-21"

# Aucune URL publique. Le Worker n'expose plus de handler `fetch` : il n'a
# donc rien à servir, et pas besoin d'un sous-domaine workers.dev.
# `preview_urls` doit suivre, sinon wrangler réclame le sous-domaine malgré
# `workers_dev = false` pour servir les URL de prévisualisation.
workers_dev = false
preview_urls = false

# Toutes les 15 minutes, en UTC — sans importance ici, l'intervalle est
# régulier et le choix de l'heure de publication appartient à publisher.py.
[triggers]
crons = ["*/15 * * * *"]

# Valeurs non sensibles.
[vars]
GITHUB_OWNER = "GAUSS-TPAC"
GITHUB_REPO = "PostAgent"

# Secret — jamais ici. DISPATCH_TOKEN est déposé à chaque déploiement par
# .github/workflows/deploy-clock.yml, depuis le secret du dépôt DISPATCH_PAT.

# Journaux et traces, à activer avant la production : `enabled` seul ne suffit
# pas pour les traces, il faut aussi `traces.enabled`. Volume attendu de
# 96 invocations par jour, donc échantillonnage à 100 % sans souci de coût.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1
