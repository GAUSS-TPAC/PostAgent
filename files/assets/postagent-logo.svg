<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="PostAgent">
  <!-- P d'un seul trait : la boucle, ouverte, est une flèche d'envoi -->
  <polyline points="56,166 56,34 128,34 150,72 128,110 78,110" fill="none" stroke="currentColor"
            stroke-width="11" stroke-linecap="butt" stroke-linejoin="miter"/>
  <!-- le post qui part, à son heure -->
  <rect x="166" y="65" width="14" height="14" transform="rotate(45 173 72)" fill="currentColor"/>
</svg>
